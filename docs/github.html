<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub &middot; Agentstrap Docs</title>
<meta name="description" content="GitHub releases, deployments and repository links for Agentstrap.">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/Agentstrap.ico" type="image/x-icon">
</head>
<body data-page="github.html" data-base="">
<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation">&#9776;</button>
  <a class="brand" href="index.html">
    <span class="brand-mark"><img src="assets/Agentstrap.ico" alt="" width="26" height="26"></span>
    Agentstrap <small>Docs</small>
  </a>
  <span class="topbar-spacer"></span>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search docs&hellip;" autocomplete="off" aria-label="Search documentation">
    <div id="search-results"></div>
  </div>
  <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
</header>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <h1>GitHub</h1>
    <p class="page-lede">Releases, deployments and repository links for Agentstrap.</p>

    <p><a class="btn" href="https://github.com/agentxco2-dev/Agentstrap" target="_blank" rel="noopener">Open GitHub Repository</a></p>

    <h2>Install Agentstrap</h2>
    <p id="install-status">Loading latest release...</p>
    <div id="install-area"></div>

    <h2>Releases</h2>
    <div id="releases">Loading releases...</div>

    <h2>Deployments</h2>
    <div id="deployments">Loading deployments...</div>
  </main>
</div>
<script src="assets/site.js"></script>
<script>
const REPO = "agentxco2-dev/Agentstrap";

async function loadReleases() {
  const res = await fetch(`https://api.github.com/repos/${REPO}/releases`);
  const releases = await res.json();
  const area = document.getElementById("install-area");
  const status = document.getElementById("install-status");
  if (Array.isArray(releases) && releases.length) {
    const latest = releases[0];
    const asset = (latest.assets || []).find(a => a.name.endsWith(".exe")) || (latest.assets || [])[0];
    if (asset) {
      status.textContent = `Latest release: ${latest.tag_name}`;
      area.innerHTML = `<a class="btn" href="${asset.browser_download_url}">Install Agentstrap (${asset.name})</a>`;
    } else {
      status.textContent = `Latest release: ${latest.tag_name} (no executable asset)`;
    }
  } else {
    status.textContent = "No releases found.";
  }

  const container = document.getElementById("releases");
  if (!Array.isArray(releases) || !releases.length) {
    container.textContent = "No releases found.";
    return;
  }
  container.innerHTML = releases.map(r => `
    <div class="card" style="margin-bottom:12px;">
      <h3>${r.name || r.tag_name}</h3>
      <p><a href="${r.html_url}" target="_blank" rel="noopener">${r.tag_name}</a> &middot; ${new Date(r.published_at).toLocaleDateString()}</p>
      <div style="white-space:pre-wrap;">${r.body || ""}</div>
      <h4>Assets</h4>
      <ul>
        ${(r.assets || []).map(a => `<li><a href="${a.browser_download_url}" target="_blank" rel="noopener">${a.name}</a> (${Math.round(a.size/1024)} KB)</li>`).join("")}
      </ul>
    </div>
  `).join("");
}

async function loadDeployments() {
  const res = await fetch(`https://api.github.com/repos/${REPO}/deployments`);
  const deployments = await res.json();
  const container = document.getElementById("deployments");
  if (!Array.isArray(deployments) || !deployments.length) {
    container.textContent = "No deployments found.";
    return;
  }
  container.innerHTML = deployments.map(d => `
    <div class="card" style="margin-bottom:12px;">
      <h3>${d.environment}</h3>
      <p>${d.description || ""} &middot; ${new Date(d.created_at).toLocaleDateString()}</p>
      <p><a href="https://github.com/${REPO}/deployments/${d.id}" target="_blank" rel="noopener">View deployment</a></p>
    </div>
  `).join("");
}

loadReleases().catch(e => {
  document.getElementById("releases").textContent = "Failed to load releases: " + e.message;
});
loadDeployments().catch(e => {
  document.getElementById("deployments").textContent = "Failed to load deployments: " + e.message;
});
</script>
</body>
</html>
